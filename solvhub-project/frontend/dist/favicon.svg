<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="8" fill="#0d2240"/>

  <!-- Outer circle ring -->
  <circle cx="32" cy="24" r="16" fill="none" stroke="#c8d8e8" stroke-width="2"/>

  <!-- Inner circle fill (blue) -->
  <circle cx="32" cy="24" r="13" fill="#1a5fa8"/>

  <!-- Welder helmet / head silhouette -->
  <ellipse cx="34" cy="17" rx="6" ry="5" fill="#c8d8e8"/>
  <!-- Helmet visor -->
  <rect x="29" y="18" width="9" height="5" rx="1" fill="#0d2240"/>

  <!-- Body / torso -->
  <path d="M24 30 Q26 24 32 26 Q38 24 40 30 L38 38 L26 38 Z" fill="#c8d8e8"/>

  <!-- Left arm reaching down -->
  <path d="M26 32 Q20 36 18 42" stroke="#c8d8e8" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Welding tool -->
  <line x1="18" y1="42" x2="16" y2="45" stroke="#c8d8e8" stroke-width="2" stroke-linecap="round"/>

  <!-- Spark / weld flash -->
  <circle cx="15" cy="46" r="2" fill="#4fc3f7" opacity="0.9"/>
  <line x1="15" y1="44" x2="13" y2="42" stroke="#4fc3f7" stroke-width="1" stroke-linecap="round"/>
  <line x1="17" y1="44" x2="19" y2="42" stroke="#4fc3f7" stroke-width="1" stroke-linecap="round"/>
  <line x1="13" y1="46" x2="11" y2="46" stroke="#4fc3f7" stroke-width="1" stroke-linecap="round"/>

  <!-- Ground line -->
  <line x1="10" y1="47" x2="40" y2="47" stroke="#c8d8e8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- "SH" text at bottom -->
  <text x="32" y="59" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#4fc3f7" text-anchor="middle" letter-spacing="1">SOLVHUB</text>
</svg>
